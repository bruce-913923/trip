name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      # GitHub's artifact list can briefly lag behind upload completion.
      # Wait for the exact artifact in this fresh workflow run before deploying.
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 24); do
            artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)"
            if [ "$artifact_count" = "1" ]; then
              echo "Pages artifact is available; allowing deployment API to index it"
              sleep 35
              exit 0
            fi
            if [ "$artifact_count" != "0" ]; then
              echo "Unexpected count of Pages artifacts: $artifact_count" >&2
              exit 1
            fi
            echo "Pages artifact not listed yet (attempt ${attempt}/24)"
            sleep 5
          done
          echo "Timed out waiting for Pages artifact" >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
