<!doctype html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bruce's Trips｜旅行行程收藏</title>

<style>
:root{--bg:#f4f0e7;--ink:#17241f;--muted:#69756f;--card:#fffdf7;--line:#d9d3c8;--green:#173f32;--sand:#d9b77f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{width:min(980px,calc(100% - 32px));margin:auto;padding:72px 0 100px}
.eyebrow{font-size:.78rem;letter-spacing:.16em;font-weight:800;color:#5c6e65}
h1{font-size:clamp(2.7rem,7vw,5.8rem);line-height:.96;letter-spacing:-.055em;margin:14px 0 18px}
.lead{max-width:680px;color:var(--muted);font-size:1.05rem;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:48px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;transition:.18s transform,.18s box-shadow}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(30,45,38,.10)}
.visual{height:260px;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45)),url('https://www.taiwan.nps.gov.tw/upload/filesys/image/01_chinese/2022_Journal/14/trail1.jpg') center/cover}
.body{padding:22px}.meta{font-size:.78rem;font-weight:800;color:#7b6d55;letter-spacing:.08em}.body h2{font-size:1.45rem;margin:8px 0}.body p{color:var(--muted);line-height:1.7;margin:0}.arrow{margin-top:18px;font-weight:800;color:var(--green)}
footer{margin-top:70px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem}
@media(max-width:680px){main{padding-top:52px}.grid{grid-template-columns:1fr}.visual{height:220px}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">BRUCE'S TRAVEL ARCHIVE</div>
  <h1>Trips.<br>把旅程留下來。</h1>
  <p class="lead">這裡收錄每一次旅行的路線、景點、住宿與時間安排。之後新增的旅遊網頁，都會從這個首頁進入。</p>
  <div class="grid">
    <a class="card" href="./taitung-southcross-2d1n/">
      <div class="visual"></div>
      <div class="body">

        <h2>高雄 × 台東 × 南橫</h2>
        <p>南迴看海、台東住一晚，再從南橫翻山回高雄的雙人自駕行程。</p>
        <div class="arrow">查看完整行程 →</div>
      </div>
    </a>
  </div>
  <footer>Personal trip planning archive · bruce-913923</footer>
</main>
</body>
</html>
